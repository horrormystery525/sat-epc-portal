name: Streamlit Keep-Alive

on:
  schedule:
    # Runs every 8 hours (GitHub cron uses UTC time)
    - cron: '0 */8 * * *'
  workflow_dispatch: # Allows you to manually test it anytime from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send HTTP request to keep app alive
        run: |
          response=$(curl --max-time 60 -s -o /dev/null -w "%{http_code}" https://satyam-epc.streamlit.app/)
          echo "Pinged Streamlit app. HTTP Status Code: $response"
          if [ "$response" -ge 400 ]; then
            echo "Warning: Received error status code $response"
            exit 1
          fi
